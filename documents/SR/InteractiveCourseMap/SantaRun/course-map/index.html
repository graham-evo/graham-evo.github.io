<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f7f3ed;font-family:Arial,sans-serif;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px 18px}h1{margin:0 0 4px;color:#b70a0a}p{margin-top:0;color:#555}.card,.details-card{overflow:hidden;background:#fff;border:1px solid #d8cbc0;border-top:5px solid #b70a0a;border-radius:4px}.details-card{margin-top:18px;border-top-width:1px}#map{height:min(68vh,650px);min-height:420px}.summary{padding:12px 16px}.mile-marker,.endpoint-marker{display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:50%;color:#fff;box-shadow:0 1px 4px #555;font:bold 12px Arial}.mile-marker{width:28px;height:28px;background:#fff;border-color:#b70a0a;color:#b70a0a}.endpoint-marker{width:32px;height:32px;font-size:15px}.details-card h2{margin:0;padding:18px 18px 8px;color:#b70a0a;font-size:1.25rem}.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid #d8cbc0;padding:0 12px}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:#555;padding:11px 12px;cursor:pointer;font-weight:bold}.tab.active{border-bottom-color:#b70a0a;color:#b70a0a}.tab-panel{padding:18px}.tab-panel[hidden]{display:none}.details-table{width:100%;border-collapse:collapse;font-size:.94rem}.details-table th,.details-table td{padding:10px;border-bottom:1px solid #e8dfd8;text-align:left;vertical-align:top}.details-table th{width:32%;color:#555}.notes{margin:0;padding-left:20px;line-height:1.55}@media(max-width:600px){.wrap{padding:16px 0}.wrap>h1,.wrap>p{margin-left:16px;margin-right:16px}#map{height:65vh;min-height:370px}.tab{font-size:.82rem;padding:10px 8px}}</style></head><body><main class="wrap"><h1 id="event"></h1><p id="course"></p><section class="card"><div id="map"></div><div class="summary"><strong>Course distance:</strong> <span id="distance"></span></div></section><section class="details-card"><h2>Course information</h2><div class="tabs" role="tablist"><button class="tab active" role="tab" data-tab="certificate">USATF Certificate</button><button class="tab" role="tab" data-tab="measurements">Measurement Points</button><button class="tab" role="tab" data-tab="elevation">Elevation</button><button class="tab" role="tab" data-tab="notes">Notes &amp; Restrictions</button></div><div class="tab-panel" id="certificate"></div><div class="tab-panel" id="measurements" hidden></div><div class="tab-panel" id="elevation" hidden></div><div class="tab-panel" id="notes" hidden></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script src="map.js"></script></body></html>
