  .map-filter-sidebar .control-label {

  .map-filter-sidebar .selectize-input {
    border: 1px solid #b9aaa0;
    border-radius: 3px;
    box-shadow: none;
    background: #ffffff;
  }

  .map-filter-sidebar .selectize-input.focus {
    border-color: #b70a0a;
    box-shadow: 0 0 0 2px rgba(183, 10, 10, 0.15);
  }

  /* Dropdown options */
  .map-filter-sidebar .selectize-dropdown {
    border-color: #b9aaa0;
    border-radius: 3px;
  }

  .map-filter-sidebar .selectize-dropdown .active {
    background: #f2d7d7;
    color: #4b0000;
  }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper {
    border-radius: 4px;
  }

  .leaflet-popup-content h3 {
    color: #b70a0a;
  }

  .leaflet-tooltip {
    background: #ffffff;
    border: 1px solid #b70a0a;
    color: #333333;
    font-weight: bold;
    box-shadow: none;
  }
  
  .specimen-popup .leaflet-popup-content {
  font-size: 12px;
  line-height: 1.35;
  margin: 12px;
  max-height: 220px;
  overflow-y: auto;
  overflow-x: hidden;
}

.specimen-popup .leaflet-popup-scrolled {
  border-top: none;
  border-bottom: none;
  margin-right: 0;
  padding-right: 8px;
}

  /* Stack filters above the map on narrow screens */
  @media (max-width: 767px) {
    .map-filter-sidebar {
      margin-bottom: 18px;
    }
  }
</style>
